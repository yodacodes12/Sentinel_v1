# Optional drop-in for the optional systemd user unit (sentinel.service).
#
# The unit allows only Unix sockets, so a daemon started by it cannot reach
# the internet, and opt-in document discovery reports every online source as
# unreachable. Install this drop-in only if you want online document
# discovery while Sentinel runs from systemd. It adds IPv4 and IPv6 sockets
# and changes nothing else; the daemon still connects only when online
# discovery is turned on in Sentinel's settings and you start a search.
#
#   mkdir -p ~/.config/systemd/user/sentinel.service.d
#   cp sentinel-online-discovery.conf ~/.config/systemd/user/sentinel.service.d/
#   systemctl --user daemon-reload && systemctl --user restart sentinel
#
# Sentinel never installs, enables or edits systemd units itself.
[Service]
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
