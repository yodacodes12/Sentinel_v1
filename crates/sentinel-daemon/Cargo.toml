[package]
name = "sentinel-daemon"
description = "The Sentinel background daemon (sentineld)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "sentineld"
path = "src/main.rs"

[dependencies]
sentinel-core.workspace = true
sentinel-config.workspace = true
sentinel-logging.workspace = true
sentinel-ipc.workspace = true
sentinel-storage.workspace = true
sentinel-inventory.workspace = true
sentinel-hardware.workspace = true
sentinel-utilities.workspace = true
sentinel-telemetry.workspace = true
sentinel-alerts.workspace = true
sentinel-history.workspace = true
sentinel-docs.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
url.workspace = true
# FIFOs that stand in for a hung sensor read in tests.
rustix = { workspace = true, features = ["fs"] }
serde_json.workspace = true
