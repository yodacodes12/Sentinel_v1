[package]
name = "sentinel-tests"
description = "End-to-end and safety tests that drive the real Sentinel binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Unit tests live beside the code they test, in each crate's `#[cfg(test)]`
# modules. This package holds the cross-process suites.

[lib]
path = "support/lib.rs"

[[test]]
name = "integration"
path = "integration/main.rs"

[[test]]
name = "safety"
path = "safety/main.rs"

[[test]]
name = "hardware"
path = "hardware/main.rs"

[dependencies]
sentinel-core.workspace = true
sentinel-config.workspace = true
sentinel-client.workspace = true
sentinel-ipc.workspace = true
sentinel-inventory.workspace = true
sentinel-hardware.workspace = true
sentinel-utilities.workspace = true
sentinel-telemetry.workspace = true
serde.workspace = true
sentinel-storage.workspace = true
sentinel-docs.workspace = true
rustix = { workspace = true, features = ["param"] }
serde_json.workspace = true
tempfile.workspace = true
